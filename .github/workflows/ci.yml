name: Sentinel-SRE Multi-Agent Diagnostics & DR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-backend-and-frontend:
    name: Python 3.13 Backend, 24-Incident Chaos Benchmark & Next.js 16.4 Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Python Backend & Deploy Config Test Suite (30 tests)
        run: python3 -m unittest discover -s tests -v

      - name: Execute 24-Scenario Chaos & Zero-Trust Guardrail Benchmark
        run: python3 benchmarks/run_benchmark.py

      - name: Install Frontend Dependencies & Run Contract Test Suite (43 tests)
        working-directory: frontend
        run: |
          bun install
          bun test
          bun run build
